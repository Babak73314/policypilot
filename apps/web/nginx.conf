# PolicyPilot web: the SPA, plus the API paths proxied to the `api` service
# (docs/design/api.md, routing matrix). Published on 127.0.0.1:8080 by docker compose.

# Docker's DNS, re-resolved at request time, so the API can restart or start later.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    # $http_host keeps the port; the MCP server checks Host against an allow-list (DNS rebinding).
    proxy_set_header Host $http_host;
    # nginx is the edge locally: the client address is the TCP peer. Overwriting (not appending)
    # X-Forwarded-For stops a client from choosing the IP that rate limits key on.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    set $api http://api:8000;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Chat turns stream Server-Sent Events, and MCP uses Streamable HTTP: no buffering, and a read
    # timeout well above the 15-second keep-alive comments.
    location /api/v1/chat/ {
        proxy_pass $api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location = /mcp {
        proxy_pass $api;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /mcp/ {
        proxy_pass $api;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass $api;
    }

    location /webhooks/ {
        proxy_pass $api;
    }

    # The API mounts /dev only with APP_ENV=local and WHATSAPP_MODE=simulator; otherwise it 404s.
    location /dev/ {
        proxy_pass $api;
    }

    location = /healthz {
        proxy_pass $api;
    }

    location = /readyz {
        proxy_pass $api;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA: every other path is a client route.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
