# Policy questions (RAG): answers cite the wording of the product the customer named. Offline,
# the hashing embedder is lexical only, so these check the route, the tool and the cited product;
# the live judge checks that each claim is supported by the cited clause.

- id: rag-kestrel-suicide
  group: policy_qa
  description: A question naming a carrier cites only that carrier's wordings.
  turns:
    - "Does the Kestrel policy cover suicide in the first years?"
  expect:
    route: [product_question]
    tools_called: [search_policy_documents]
    citations_min: 1
    citation_products: [KESTREL-TERM-10, KESTREL-TERM-20, KESTREL-TERM-30]
  judge:
    - Says that suicide within the first two years is excluded, as the cited clause states
    - Makes no claim that the cited text does not support

- id: rag-solace-gold-maternity
  group: policy_qa
  description: A named plan scopes the search to that plan's wording.
  turns:
    - "Is there a waiting period for maternity on the Solace Gold plan?"
  expect:
    route: [product_question]
    citations_min: 1
    citation_products: [SOLACE-GOLD]
  judge:
    - States the maternity waiting period from the Solace Gold wording

