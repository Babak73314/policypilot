[project]
name = "policypilot"
version = "0.1.0"
description = "PolicyPilot API: a multi-agent AI copilot for a multi-carrier insurance agency."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.165.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "email-validator>=2.4.0",
  "sqlalchemy[asyncio]>=2.1.9",
  "alembic>=1.20.1",
  "psycopg[binary,pool]>=3.3.9",
  "pgvector>=0.5.1",
  "langchain-core>=1.8.4",
  "langchain-anthropic>=1.7.12",
  "langchain-openai>=1.8.5",
  "langgraph>=1.2.23",
  "langgraph-checkpoint-postgres>=3.2.1",
  "mcp>=2.3.0",
  "fastembed>=0.9.1",
  "pypdf>=7.1.1",
  "fpdf2>=2.9.0",
  "httpx>=0.28.1",
  "structlog>=26.1.0",
  "babel>=2.18.0",
  "pyjwt>=2.15.1",
  "argon2-cffi>=25.1.0",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.3",
  "typer>=0.29.2",
]

[project.optional-dependencies]
langfuse = ["langfuse>=5.2.0"]
bedrock = ["langchain-aws[anthropic]>=1.9.3"]

[project.scripts]
policypilot = "policypilot.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "hypothesis>=6.170.16",
  "respx>=0.23.1",
  "ruff>=0.17.6",
  "mypy>=2.4.1",
  "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policypilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = ["S101"]  # assert is fine in tests and invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"src/**" = ["PT018"]
"evals/**" = ["S"]
"migrations/**" = ["N999", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["policypilot", "evals"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*", "fpdf.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = [
  "db: needs a PostgreSQL database (DATABASE_URL); skipped when unavailable",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["policypilot"]
branch = true
