# Webhook-only gateway for a public tunnel (docs/design/whatsapp.md, "Connecting a real Meta test
# number"). Point the tunnel at 127.0.0.1:8081, never at the web app on 8080: this server forwards
# exactly one path, so the UI, the agent API, MCP and /dev are unreachable from the internet.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    set $api http://api:8000;

    location = /webhooks/whatsapp {
        limit_except GET POST { deny all; }
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 404;
    }
}
