# Channel templates (ADR-0013). `body` uses {placeholders} listed in `params`.
# WhatsApp entries with `meta_template_name` must be created and approved in WhatsApp Manager
# with exactly this text before they can be used outside the 24-hour window (docs/design/whatsapp.md).
# The simulator renders `body` directly.

templates:
  - key: ai_disclosure
    channel: web
    locale: en
    params: [agency_name]
    body: >-
      Hi! I'm PolicyPilot, an AI assistant for {agency_name} (a fictional demo agency).
      I can help you compare life, health and auto insurance, answer questions from the policy
      documents and prepare an application. Prices I show are estimates, and a licensed agent reviews
      every application. Please don't share card, bank or ID numbers here. Type "agent" at any time
      to talk to a person.

