  # --- application and review flow (deterministic; agent-design.md#application-state-machine)
  - key: app_need_quote
    channel: web
    locale: en
    params: []
    body: >-
      Happy to help you apply. First, let's find the right product: tell me what kind of cover you
      need (life, health or auto) and I'll prepare estimates.

  - key: app_choose_product
    channel: web
    locale: en
    params: [options]
    body: "Which product would you like to apply for?\n{options}"

  - key: app_collect_contact
    channel: web
    locale: en
    params: [product, missing]
    body: >-
      Great choice: {product}. So that a licensed agent can follow up, please share {missing}.
      Please don't include card, bank or ID numbers.

  - key: app_consent
    channel: web
    locale: en
    params: []
    body: >-
      Thanks. May a licensed agent from the agency contact you about this request? We use your
      details only for this purpose (see Privacy at the top of this page). Please answer yes or no.

  - key: app_summary
    channel: web
    locale: en
    params: [product, price, needs, contact]
    body: "Here is your application summary:\n- Product: {product}\n- Estimate: {price}\n- Your needs: {needs}\n- Contact: {contact}\nShall I submit it for review by a licensed agent?"

  - key: app_submitted
    channel: web
    locale: en
    params: []
    body: >-
      Your application has been sent to a licensed agent for review. Nothing is binding yet - the
      agent will check it and reply here.

  - key: contact_request_done
    channel: web
    locale: en
    params: []
    body: Thank you. A licensed agent will contact you shortly.

  - key: consent_declined
    channel: web
    locale: en
    params: []
    body: >-
      No problem - I won't pass your details on. You can keep comparing products, or ask me
      anything else about the policies.

  - key: review_decision_approved
    channel: web
    locale: en
    params: [note]
    body: >-
      Good news: a licensed agent approved your application draft. They will contact you to complete
      it with the carrier. {note}

  - key: review_decision_changes
    channel: web
    locale: en
    params: [note]
    body: "A licensed agent reviewed your application and needs a change before it can go ahead. {note} Tell me what you'd like to update."

  - key: review_decision_rejected
    channel: web
    locale: en
    params: [note]
    body: "A licensed agent reviewed your application and can't take it forward. {note} You're welcome to compare other products."

  - key: review_withdrawn
    channel: web
    locale: en
    params: []
    body: Your application has been withdrawn. Nothing was submitted to the carrier.

  - key: review_escalated
    channel: web
    locale: en
    params: []
    body: An agent is already reviewing your request; I've marked it as a priority for them.
