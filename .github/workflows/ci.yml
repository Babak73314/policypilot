# Lint, types, tests, offline evals, the README quick start, and a security pass.
# No job deploys anything, and no job uses a model API key.
name: CI

on:
  push:
    branches: [main, phase-1]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.9"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag is published
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # The same database bootstrap as local development (roles, databases, the vector extension).
      - name: Start PostgreSQL with pgvector
        run: |
          python3 scripts/init_env.py
          docker compose up -d --wait db
      - name: Install
        working-directory: apps/api
        run: uv sync --frozen
      - name: Lint and format
        working-directory: apps/api
        run: |
          uv run ruff check src tests migrations evals ../../scripts
          uv run ruff format --check src tests migrations evals ../../scripts
      - name: Types (mypy --strict)
        working-directory: apps/api
        run: uv run mypy
      - name: Migrations up, down, up
        working-directory: apps/api
        run: |
          export DATABASE_URL="postgresql+psycopg://policypilot:$(grep '^POLICYPILOT_DB_PASSWORD=' ../../.env | cut -d= -f2-)@127.0.0.1:5432/policypilot_test"
          export POLICYPILOT_EXPECTED_DB=policypilot_test
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        working-directory: apps/api
        run: uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag is published
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Start PostgreSQL with pgvector
        run: |
          python3 scripts/init_env.py
          docker compose up -d --wait db
      - name: Offline eval suite (scripted model)
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run python -m evals
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: apps/api/evals/reports/
          if-no-files-found: ignore

  compose-smoke:
    # The exact README path: init_env, compose up, smoke tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag is published
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python3 scripts/init_env.py
      - run: docker compose up -d --build --wait
      - run: python3 scripts/smoke.py
      - name: MCP smoke (official SDK client)
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run python ../../scripts/mcp_smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag is published
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependencies (pip-audit)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --require-hashes
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Web dependencies (npm audit, high and above)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
