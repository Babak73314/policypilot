# Optional: a webhook-only gateway for connecting a real Meta test number (docs/design/whatsapp.md).
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
# then point your HTTPS tunnel at http://127.0.0.1:8081. Only POST/GET /webhooks/whatsapp passes;
# the web app, the agent API, MCP and /dev stay unreachable from the tunnel. Set WHATSAPP_MODE=cloud
# first: in cloud mode the API does not mount the /dev simulator routes at all.
services:
  webhook-gateway:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    volumes:
      - ./docker/nginx/tunnel.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
